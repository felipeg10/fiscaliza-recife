name: Atualizar Dados do SAPL Recife

on:
  schedule:
    - cron: '0 8 * * *' # Roda todo dia às 08:00 UTC
  workflow_dispatch: # Permite rodar manualmente pelo site do GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copiar repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Executar script de coleta
        run: python coletar_dados.py

      - name: Enviar dados atualizados para o GitHub
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Atualização automática dos dados legislativos"
          file_pattern: dados.json