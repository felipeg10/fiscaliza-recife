name: Sincronizar Dados Legislativos

on:
  schedule:
    - cron: '0 */6 * * *' # Executa a cada 6 horas automaticamente
  workflow_dispatch:      # Permite que você clique em um botão para rodar manualmente quando quiser

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Rodar script de coleta da Câmara
        run: python coletar_dados.py

      - name: Enviar dados atualizados para o repositório
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add dados.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualização automática dos dados legislativos [skip ci]" && git push)