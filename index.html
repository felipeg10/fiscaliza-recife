<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiscaliza Recife - Monitoramento Legislativo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js para os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-50 font-sans text-gray-800">

    <!-- Cabeçalho -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    🏛️ Fiscaliza Recife
                </h1>
                <p class="text-blue-200 text-sm mt-1">Monitoramento inteligente e transparente dos Projetos de Lei da
                    Câmara Municipal</p>
            </div>
            <div class="mt-4 md:mt-0">
                <span
                    class="bg-blue-800 text-blue-100 text-xs font-semibold px-3 py-1.5 rounded-full border border-blue-700">
                    ⚡ Dados atualizados direto da API oficial
                </span>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- Cards de Estatísticas -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm font-medium text-gray-500">Matérias Listadas (Filtro Atual)</p>
                <p id="total-materias" class="text-3xl font-bold text-blue-900 mt-2">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm font-medium text-gray-500">Temas Mapeados</p>
                <p class="text-3xl font-bold text-emerald-600 mt-2">8 Categorias</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm font-medium text-gray-500">Status do Sistema</p>
                <p class="text-3xl font-bold text-indigo-600 mt-2">100% Operacional</p>
            </div>
        </div>

        <!-- Seção de Gráficos e Filtros -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Gráfico por Tema -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 lg:col-span-1">
                <h3 class="text-lg font
