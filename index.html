<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiscaliza Recife | Inteligência e Transparência Legislativa</title>
    <style>
        :root {
            --bg-base: #090d16;
            --bg-surface: #111827;
            --bg-card: #1f2937;
            --border-color: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-area h1 span {
            color: var(--accent-green);
        }

        .logo-area p {
            margin: 4px 0 0 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        .container {
            max-width: 1400px;
            margin: 32px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 32px;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .filtros-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 10px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .filtros-box select {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            flex: 1;
            min-width: 220px;
            outline: none;
            transition: border-color 0.2s;
        }

        .filtros-box select:focus {
            border-color: var(--accent-green);
        }

        .card-proposicao {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .card-proposicao:hover {
            border-color: #4b5563;
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge-tipo {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-status {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .ementa {
            font-size: 15px;
            line-height: 1.6;
            color: #e5e7eb;
            margin-bottom: 16px;
        }

        .meta-info {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .meta-info strong {
            color: var(--text-main);
        }

        .acoes-documento {
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-acao {
            padding: 7px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-pdf {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-pdf:hover {
            background-color: rgba(239, 68, 68, 0.25);
        }

        .btn-oficial {
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .btn-oficial:hover {
            background-color: rgba(59, 130, 246, 0.25);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .ranking-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
        }

        .ranking-box h3 {
            margin-top: 0;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(55, 65, 81, 0.5);
            font-size: 14px;
        }

        .ranking-item:last-child {
            border-bottom: none;
        }

        .ranking-item strong {
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--accent-green);
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-area">
            <h1>Fiscaliza<span>Recife</span></h1>
            <p>Plataforma de Inteligência e Auditoria Legislativa</p>
        </div>
        <div style="font-size: 13px; color: var(--text-muted);">
            Dados Oficiais • Câmara Municipal
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <div class="filtros-box">
                <select id="filtroTipo" onchange="filtrarDados()">
                    <option value="">Todos os Tipos de Matéria</option>
                    <option value="Projeto de Lei Complementar">Projeto de Lei Complementar</option>
                    <option value="Projeto de Lei Ordinária">Projeto de Lei Ordinária</option>
                    <option value="Requerimento">Requerimento</option>
                    <option value="Indicação">Indicação</option>
                </select>
                <select id="filtroAutor" onchange="filtrarDados()">
                    <option value="">Todos os Autores</option>
                </select>
            </div>

            <div id="listaProposicoes">
                <!-- Cards injetados via JS -->
            </div>
        </div>

        <div class="sidebar">
            <div class="ranking-box">
                <h3>🏆 Ranking de Produtividade</h3>
                <div id="rankingAutores">
                    <!-- Ranking injetado via JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let dadosGlobais = [];

        async function carregarDados() {
            try {
                const response = await fetch('dados.json');
                dadosGlobais = await response.json();
                popularFiltrosAutores(dadosGlobais);
                renderizar(dadosGlobais);
            } catch (error) {
                console.error("Erro ao carregar dados.json:", error);
                document.getElementById('listaProposicoes').innerHTML = '<p style="color: #f87171; padding: 20px;">Erro ao carregar a base de dados legislativa.</p>';
            }
        }

        function popularFiltrosAutores(dados) {
            const autoresSet = [...new Set(dados.map(item => item.autor))].sort();
            const selectAutor = document.getElementById('filtroAutor');
            autoresSet.forEach(autor => {
                const opt = document.createElement('option');
                opt.value = autor;
                opt.textContent = autor;
                selectAutor.appendChild(opt);
            });
        }

        function renderizar(dados) {
            const container = document.getElementById('listaProposicoes');
            container.innerHTML = '';

            if (dados.length === 0) {
                container.innerHTML = '<p style="padding: 20px; color: var(--text-muted);">Nenhuma matéria encontrada com os filtros selecionados.</p>';
                atualizarRanking([]);
                return;
            }

            dados.forEach(item => {
                // Garante que os links funcionem e apareçam em todos os cards
                const urlPdf = (item.url_pdf && item.url_pdf.trim() !== '') ? item.url_pdf : `https://sapl.recife.pe.leg.br/materia/${item.id_sapl || '1201'}`;
                const urlOficial = (item.url_oficial && item.url_oficial.trim() !== '') ? item.url_oficial : `https://sapl.recife.pe.leg.br/materia/${item.id_sapl || '1201'}`;

                const card = document.createElement('div');
                card.className = 'card-proposicao';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="badge-tipo">${item.identificacao || 'Matéria'}</span>
                        <span class="badge-status">${item.status || 'Em Tramitação'}</span>
                    </div>
                    <p class="ementa">${item.ementa || 'Sem ementa informada.'}</p>
                    <div class="meta-info">
                        <span><strong>Autor(a):</strong> ${item.autor || 'Não informado'}</span>
                        <span>•</span>
                        <span><strong>Tema:</strong> ${item.tema || 'Geral'}</span>
                    </div>
                    <div class="acoes-documento">
                        <a href="${urlPdf}" target="_blank" class="btn-acao btn-pdf">📄 Ver PDF / Documento</a>
                        <a href="${urlOficial}" target="_blank" class="btn-acao btn-oficial">🔗 Portal da Câmara</a>
                    </div>
                `;
                container.appendChild(card);
            });

            atualizarRanking(dados);
        }

        function filtrarDados() {
            const tipoFiltro = document.getElementById('filtroTipo').value;
            const autorFiltro = document.getElementById('filtroAutor').value;

            const filtrados = dadosGlobais.filter(item => {
                const matchTipo = tipoFiltro === '' || item.tipo_materia === tipoFiltro;
                const matchAutor = autorFiltro === '' || item.autor === autorFiltro;
                return matchTipo && matchAutor;
            });

            renderizar(filtrados);
        }

        function atualizarRanking(dados) {
            const contagem = {};
            dados.forEach(item => {
                const autor = item.autor || 'Não informado';
                contagem[autor] = (contagem[autor] || 0) + 1;
            });

            const rankingOrdenado = Object.entries(contagem).sort((a, b) => b[1] - a[1]);
            const containerRanking = document.getElementById('rankingAutores');
            containerRanking.innerHTML = '';

            if (rankingOrdenado.length === 0) {
                containerRanking.innerHTML = '<p style="font-size: 13px; color: var(--text-muted);">Sem dados para o ranking.</p>';
                return;
            }

            rankingOrdenado.forEach(([autor, total], index) => {
                const div = document.createElement('div');
                div.className = 'ranking-item';
                div.innerHTML = `<span>${index + 1}. ${autor}</span><strong>${total}</strong>`;
                containerRanking.appendChild(div);
            });
        }

        carregarDados();
    </script>
</body>

</html>
